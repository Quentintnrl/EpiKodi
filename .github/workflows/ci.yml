name: ci

env:
  MIRROR_URL: git@github.com:EpitechPromo2027/B-PRO-500-NAN-5-1-professionalwork-quentin.tennerel.git

on:
  push:
    branches-ignore:
      - ga-ignore-**
  pull_request:
    branches-ignore:
      - ga-ignore-**

jobs:
  install_dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Set up Rust environnement
        uses: actions/setup-rust@v1
        with:
          rust-version: 1.51.0

  push_to_mirror:
    name: Push to mirror
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: install_dependencies
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url:
            ${{ env.MIRROR_URL }}
          ssh_private_key:
            ${{ secrets.GIT_SSH_PRIVATE_KEY }}
